<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="shade"></div>
  <header><div id="clock"></div><div id="date"></div></header>
  <section class="row apps"><h2>Apps</h2><div class="track"><div id="apps" class="tiles"></div></div></section>
  <section class="row consoles"><h2>Consoles</h2><div class="track"><div id="inputs" class="tiles"></div></div></section>
  <div id="hint"><span class="key">OK</span><span class="act">Open</span><span class="key yellow">Yellow</span><span class="act">Arrange</span><span class="key red">Red</span><span class="act">Diagnostics</span></div>
  <div id="toast"></div>
  <pre id="diag"></pre>
</div>
<script src="js/mock-apps.js" data-preview-only></script>
<script src="js/tizen-mock.js" data-preview-only></script>
<script src="wallpapers.js"></script>
<script src="js/keys.js"></script>
<script src="js/focus.js"></script>
<script src="js/catalog.js"></script>
<script src="js/prefs.js"></script>
<script src="js/platform.js"></script>
<script src="js/wallpaper.js"></script>
<script src="js/diag.js"></script>
<script src="js/brands.js"></script>
<script src="js/home.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
